exec-once = /etc/greetd/bsdrunner/launch-greeter.sh

env = GTK_USE_PORTAL,0
env = GDK_DEBUG,no-portals

monitor = ,preferred,auto,1

input {
    kb_layout = us
}
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    force_default_wallpaper = 0
}
