[package]
name = "bsdrunner-greetd-greeter"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Native greetd IPC bridge for the BSDRunner Quickshell greeter"

[dependencies]
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
