# Generated by BSDRunner Power Settings.
# The default locks the session after 15 minutes of inactivity.

general {
    lock_cmd = sh ~/.config/bsdrunner/scripts/bsdrunner-lock.sh
    # FreeBSD does not provide systemd or the Linux ScreenSaver D-Bus service.
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = false
}

listener {
    timeout = 900
    on-timeout = sh ~/.config/bsdrunner/scripts/bsdrunner-lock.sh
}
