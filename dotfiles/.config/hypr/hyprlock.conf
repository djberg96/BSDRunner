general {
    disable_loading_bar = true
    hide_cursor = true
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

background {
    monitor =
    color = rgba(111216ff)
}

label {
    monitor =
    text = cmd[update:1000] date "+%H:%M"
    color = rgba(eef2f7ff)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = BSDRunner session locked
    color = rgba(a8b1bdff)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 82
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 64
    outline_thickness = 3
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(7f8794ff)
    inner_color = rgba(20242bff)
    font_color = rgba(eef2f7ff)
    fade_on_empty = false
    placeholder_text = <i>Enter password to unlock</i>
    hide_input = false
    check_color = rgba(a3be8cff)
    fail_color = rgba(d08770ff)
    fail_text = <i>Authentication failed</i>
    position = 0, -10
    halign = center
    valign = center
}
